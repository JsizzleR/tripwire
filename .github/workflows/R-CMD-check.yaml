# Standard R-CMD-check workflow (r-lib/actions). Runs on push/PR to main.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # yourhonor (Suggests) is GitHub-only and not yet published, so install
          # the CRAN-available deps explicitly and let the judge tests skip in CI.
          # When yourhonor is public, add `Remotes: <user>/yourhonor` and revert this.
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::cli
            any::ellmer
            any::mcptools
            any::jsonlite
            any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
